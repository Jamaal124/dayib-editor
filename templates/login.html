<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayib — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #c9a84c;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #555;
            font-size: 0.85rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #888;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #c9a84c;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: #c9a84c;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover { background: #e0bc60; }

        .error {
            color: #e05555;
            font-size: 0.85rem;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            .login-card { margin: 20px; padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">DAYIB</div>
        <div class="subtitle">AI VIDEO EDITOR</div>

        <form method="POST">
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" name="password" placeholder="Enter your password" autofocus>
            </div>
            <button class="btn" type="submit">ENTER</button>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
        </form>
    </div>
</body>
</html>
